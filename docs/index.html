<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FundLawHub — 法律法规与案例检索</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c-bg:#f8f9fb;--c-surface:#fff;--c-border:#e2e5ea;--c-text:#1a1f2e;
  --c-text2:#5f6b7a;--c-text3:#8e99a8;--c-accent:#1a56db;--c-accent-light:#e8effc;
  --c-green:#0d7d4a;--c-green-bg:#e6f4ed;--c-orange:#b85c00;--c-orange-bg:#fef3e5;
  --c-red:#c02020;--c-red-bg:#fce4e4;--c-yellow:#856404;--c-yellow-bg:#fff8e1;
  --sidebar-w:280px;--header-h:56px;--tab-h:44px;--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
body{font-family:var(--font);background:var(--c-bg);color:var(--c-text);line-height:1.6}#app{min-height:100vh;display:flex;flex-direction:column}
a{color:var(--c-accent);text-decoration:none}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,select{font:inherit}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;white-space:nowrap}
mark.highlight{background:#fde68a;color:inherit;padding:0 2px;border-radius:2px}
.sev-严重{background:var(--c-red-bg);color:var(--c-red)}.sev-较重{background:var(--c-orange-bg);color:var(--c-orange)}
.sev-一般{background:var(--c-yellow-bg);color:var(--c-yellow)}.sev-较轻{background:var(--c-green-bg);color:var(--c-green)}

#tab-bar{display:flex;background:var(--c-surface);border-bottom:1px solid var(--c-border);height:var(--tab-h);flex-shrink:0;padding:0 16px;gap:0}
.tab-btn{padding:0 24px;font-size:14px;font-weight:500;color:var(--c-text2);border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--c-accent);background:var(--c-accent-light)}
.tab-btn.active{color:var(--c-accent);border-bottom-color:var(--c-accent);font-weight:600}

.module{display:none;flex:1;flex-direction:column;overflow:visible}
.module.active{display:flex}

#header{height:var(--header-h);background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0}
#header h1{font-size:17px;font-weight:700;white-space:nowrap}
#search-wrap{flex:1;max-width:520px;position:relative}
#search-input,#search-input-cases{width:100%;height:36px;padding:0 40px 0 14px;border:1px solid var(--c-border);border-radius:var(--radius);font-size:14px;outline:none;transition:border-color .2s;background:var(--c-bg)}
#search-input:focus,#search-input-cases:focus{border-color:var(--c-accent);background:var(--c-surface)}
#search-input::placeholder,#search-input-cases::placeholder{color:var(--c-text3)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--c-text3);padding:4px 8px;display:none;z-index:2}
.search-clear.visible{display:block}
.header-stats{font-size:13px;color:var(--c-text2);white-space:nowrap}
.menu-btn{display:none;font-size:22px;padding:4px 8px}

#main-layout{display:flex;flex:1;min-height:0}
.sidebar{width:var(--sidebar-w);background:var(--c-surface);border-right:1px solid var(--c-border);overflow-y:auto;flex-shrink:0;padding:8px 0}
.sidebar-title{font-size:12px;font-weight:600;color:var(--c-text3);padding:8px 16px 4px;text-transform:uppercase;letter-spacing:.5px}
.sidebar-section{margin-bottom:8px}
.filter-item{display:flex;align-items:center;padding:6px 16px;cursor:pointer;font-size:13px;transition:background .15s;gap:8px;border-left:3px solid transparent}
.filter-item:hover{background:var(--c-accent-light)}
.filter-item.active{background:var(--c-accent-light);border-left-color:var(--c-accent);font-weight:600;color:var(--c-accent)}
.filter-name{flex:1}
.filter-count{font-size:11px;color:var(--c-text3);background:var(--c-bg);padding:1px 7px;border-radius:10px;min-width:24px;text-align:center}
.filter-item.active .filter-count{background:var(--c-accent);color:#fff}

#content{flex:1;overflow-y:auto;padding:16px 20px}
.list-container{display:flex;flex-direction:column;gap:10px}
.detail-container{display:none}
.detail-container.active{display:block}

.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:14px 18px;cursor:pointer;transition:box-shadow .2s,border-color .2s}
.card:hover{border-color:var(--c-accent);box-shadow:var(--shadow)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.card-title{font-size:15px;font-weight:600;color:var(--c-text);line-height:1.4}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--c-text2)}
.card-preview{font-size:12px;color:var(--c-text3);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

.detail-container{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:24px 28px}
.detail-back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--c-accent);margin-bottom:16px;padding:6px 12px;border-radius:var(--radius);transition:background .15s}
.detail-back:hover{background:var(--c-accent-light)}
.detail-title{font-size:20px;font-weight:700;margin-bottom:10px}
.detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;font-size:13px;color:var(--c-text2)}
.detail-section{margin:16px 0}
.detail-section h3{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--c-text)}
.detail-text{font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow-y:auto;padding:12px;background:var(--c-bg);border-radius:var(--radius);margin-top:8px}
.detail-warning{background:var(--c-yellow-bg);color:var(--c-yellow);padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:12px}

.stats-bar{display:flex;gap:12px;padding:0 0 12px;flex-wrap:wrap}
.stat-item{font-size:13px;padding:4px 10px;border-radius:var(--radius);background:var(--c-surface);border:1px solid var(--c-border)}

.empty-state{text-align:center;padding:60px 20px;color:var(--c-text3)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state h3{font-size:18px;margin-bottom:6px;color:var(--c-text2)}

.loading-wrap{text-align:center;padding:50px 20px;color:var(--c-text3);font-size:14px}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--c-border);border-top-color:var(--c-accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:49}
.overlay.open{display:block}

@media(max-width:768px){
  #header h1{font-size:14px}
  .header-stats{display:none}
  .menu-btn{display:block!important}
  .sidebar{position:fixed;left:calc(-1*var(--sidebar-w));top:calc(var(--header-h) + var(--tab-h));bottom:0;z-index:50;transition:left .3s;box-shadow:2px 0 8px rgba(0,0,0,.1)}
  .sidebar.open{left:0}
  #content{padding:12px}
  .card{padding:10px 12px}
  .card-title{font-size:13px}
  .detail-container{padding:14px}
  .detail-title{font-size:17px}
  .detail-text{font-size:13px;max-height:50vh}
}
</style>
</head>
<body>
<div id="app">
  <div id="tab-bar">
    <button class="tab-btn active" data-module="laws">📚 法律法规</button>
    <button class="tab-btn" data-module="cases">⚖️ 案例库</button>
  </div>

  <!-- LAW MODULE -->
  <div id="module-laws" class="module active">
    <header id="header">
      <button class="menu-btn" data-sidebar="sidebar">☰</button>
      <h1>法律法规<span style="color:var(--c-accent)">检索</span></h1>
      <div id="search-wrap"><input type="text" id="search-input" placeholder="搜索法规标题、全文、发布机构..."><button class="search-clear" id="search-clear">✕</button></div>
      <div class="header-stats">共 <strong id="total-count">0</strong> 部</div>
    </header>
    <div id="main-layout">
      <div class="overlay" data-sidebar="sidebar"></div>
      <aside class="sidebar" id="sidebar"></aside>
      <main id="content"><div class="loading-wrap"><div class="spinner"></div><div>加载法规数据...</div></div></main>
    </div>
  </div>

  <!-- CASE MODULE -->
  <div id="module-cases" class="module">
    <header id="header-cases" style="height:var(--header-h);background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0">
      <button class="menu-btn" data-sidebar="sidebar-cases" style="display:none!important">☰</button>
      <h1 style="font-size:17px;font-weight:700;white-space:nowrap">案例<span style="color:var(--c-accent)">库</span></h1>
      <div style="flex:1;max-width:520px;position:relative"><input type="text" id="search-input-cases" placeholder="搜索当事人、文号、违规类型、处分结果..."><button class="search-clear" id="search-clear-cases">✕</button></div>
      <div class="header-stats">共 <strong id="total-count-cases">0</strong> 条</div>
    </header>
    <div id="main-layout-cases" style="display:flex;flex:1;min-height:0">
      <div class="overlay" data-sidebar="sidebar-cases"></div>
      <aside class="sidebar" id="sidebar-cases"></aside>
      <main id="content-cases" style="flex:1;overflow-y:auto;padding:16px 20px"><div class="loading-wrap"><div class="spinner"></div><div>加载案例数据...</div></div></main>
    </div>
  </div>
</div>

<script>
// ===== SHELL =====
const $ = (s,d=document) => d.querySelector(s);
const $$ = (s,d=document) => d.querySelectorAll(s);
let currentModule = 'laws';

$$('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.module === currentModule) return;
    currentModule = btn.dataset.module;
    $$('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    $$('.module').forEach(m => m.classList.toggle('active', m.id === `module-${currentModule}`));
    if (currentModule === 'cases' && !window._casesLoaded) initCaseModule();
    if (currentModule === 'laws' && !window._lawsLoaded) initLawModule();
  });
});

// Mobile sidebar
document.addEventListener('click', e => {
  const menuBtn = e.target.closest('.menu-btn');
  const overlay = e.target.closest('.overlay');
  if (menuBtn) {
    const sid = document.getElementById(menuBtn.dataset.sidebar);
    const ovl = document.querySelector(`.overlay[data-sidebar="${menuBtn.dataset.sidebar}"]`);
    sid.classList.toggle('open'); ovl.classList.toggle('open');
  }
  if (overlay) {
    const sid = document.getElementById(overlay.dataset.sidebar);
    sid.classList.remove('open'); overlay.classList.remove('open');
  }
});

// ===== UTILS =====
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function trunc(s, n) { return s && s.length > n ? s.slice(0, n) + '…' : s || ''; }
function htm(s, q) {
  if (!s) return '';
  let h = esc(s);
  if (q && q.trim()) {
    const terms = q.trim().split(/\s+/).filter(t => t.length > 0);
    for (const t of terms) {
      const e = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      h = h.replace(new RegExp(`(${e})`, 'gi'), '<mark class="highlight">$1</mark>');
    }
  }
  return h;
}

// ===== LAW MODULE =====
window._lawsLoaded = false;
function initLawModule() { if (!window._lawsLoaded) { window._lawsLoaded = true; loadLawModule(); } }

const lawState = { laws: [], filtered: [], activeCat: 'all', query: '', fuse: null, expandedId: null };
const CAT_DISPLAY = {'基金运作':'基金运作与监管','证券交易':'证券交易合规','反洗钱':'反洗钱与CRS','广告竞争':'广告与市场竞争','税务':'税务','劳动':'劳动人事','跨境':'跨境业务','基础法律':'基础法律与知识产权','量化交易':'程序化/量化交易与异常交易监控'};
const CAT_ORDER = ['基金运作','证券交易','反洗钱','广告竞争','税务','劳动','跨境','基础法律','量化交易'];

async function loadLawModule() {
  const content = $('#content');
  try {
    const r = await fetch('data/laws.json');
    lawState.laws = await r.json();
    lawState.filtered = [...lawState.laws];
    lawState.fuse = new Fuse(lawState.laws, {
      keys: [{name:'title',weight:0.5},{name:'authority',weight:0.15},{name:'full_text',weight:0.25},{name:'level',weight:0.05}],
      threshold: 0.35, distance: 100, minMatchCharLength: 1, includeScore: true, includeMatches: true, ignoreLocation: true, ignoreFieldNorm: true
    });
    renderLawSidebar(); renderLawList(lawState.laws); bindLawEvents();
    $('#total-count').textContent = lawState.laws.length;
  } catch(e) { content.innerHTML = `<div class="empty-state"><div class="icon">❌</div><h3>数据加载失败</h3><div>${esc(e.message)}</div></div>`; }
}

function renderLawSidebar() {
  const counts = {'all': lawState.laws.length};
  for (const l of lawState.laws) for (const c of (l.categories||[])) counts[c] = (counts[c]||0) + 1;
  let h = '<div class="sidebar-section"><div class="sidebar-title">板块分类</div>';
  h += `<div class="filter-item${lawState.activeCat==='all'?' active':''}" data-cat="all"><span class="filter-name">全部法规</span><span class="filter-count">${counts.all||0}</span></div>`;
  for (const cat of CAT_ORDER) { if (!counts[cat]) continue;
    h += `<div class="filter-item${lawState.activeCat===cat?' active':''}" data-cat="${cat}"><span class="filter-name">${CAT_DISPLAY[cat]||cat}</span><span class="filter-count">${counts[cat]}</span></div>`; }
  h += '</div>'; $('#sidebar').innerHTML = h;
  $$('.filter-item', $('#sidebar')).forEach(el => el.addEventListener('click', () => {
    lawState.activeCat = el.dataset.cat; lawState.expandedId = null;
    const dc = $('#content .detail-container'); if (dc) { dc.classList.remove('active'); dc.innerHTML=''; }
    const lc = $('#content .list-container'); if (lc) lc.style.display = '';
    doLawSearch(); renderLawSidebar();
  }));
}

function doLawSearch() {
  let results;
  if (lawState.query.trim()) { const fr = lawState.fuse.search(lawState.query.trim()); results = fr.map(r => r.item); }
  else results = [...lawState.laws];
  if (lawState.activeCat !== 'all') results = results.filter(l => (l.categories||[]).includes(lawState.activeCat));
  lawState.filtered = results; renderLawList(results); $('#total-count').textContent = results.length;
}

function renderLawList(laws) {
  const content = $('#content'); content.innerHTML = '';
  if (!laws.length) { content.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h3>未找到匹配的法规</h3><div>请调整搜索条件</div></div>'; return; }
  const list = document.createElement('div'); list.className = 'list-container'; content.appendChild(list);
  const detail = document.createElement('div'); detail.className = 'detail-container'; content.appendChild(detail);
  for (const law of laws) {
    const card = document.createElement('div'); card.className = 'card'; card.dataset.id = law.id;
    const pub = law.publish_date || '—', eff = law.effective_date || '—';
    card.innerHTML = `<div class="card-header"><div class="card-title">${esc(law.title)}</div><span class="badge" style="background:var(--c-accent-light);color:var(--c-accent)">${esc(law.level||'')}</span></div><div class="card-meta"><span>${esc(law.authority||'')}</span><span>|</span><span>发布 ${pub}</span>${law.effective_date ? `<span>|</span><span>施行 ${eff}</span>` : ''}</div>${law.full_text_preview ? `<div class="card-preview">${esc(trunc(law.full_text_preview, 200))}</div>` : ''}`;
    card.addEventListener('click', () => showLawDetail(law)); list.appendChild(card);
  }
}

function showLawDetail(law) {
  const list = $('#content .list-container'), detail = $('#content .detail-container');
  list.style.display = 'none'; detail.classList.add('active'); detail.innerHTML = ''; lawState.expandedId = law.id;
  const pub = law.publish_date || '—', eff = law.effective_date || '施行日期暂缺';
  const sc = law.status_str === '现行有效' ? 'sev-较轻' : law.status_str === '已废止' ? 'sev-严重' : 'sev-较重';
  detail.innerHTML = `<button class="detail-back">← 返回列表</button><div class="detail-title">${esc(law.title)}</div><div class="detail-meta">${law.level ? `<span class="badge" style="background:var(--c-accent-light);color:var(--c-accent)">${esc(law.level)}</span>` : ''}<span class="badge ${sc}">${esc(law.status_str||'—')}</span>${law.authority ? `<span>发布机构：${esc(law.authority)}</span>` : ''}<span>发布日期：${pub}</span><span>施行日期：${eff}</span></div>${law.full_text_error ? '<div class="detail-warning">⚠️ 原文加载异常</div>' : ''}<div class="detail-text">${htm(law.full_text, lawState.query)}</div>`;
  detail.querySelector('.detail-back').addEventListener('click', () => { detail.classList.remove('active'); detail.innerHTML=''; list.style.display=''; lawState.expandedId=null; });
  $('#content').scrollTop = 0;
}

function bindLawEvents() {
  const si = $('#search-input'), sc = $('#search-clear'); let timer;
  si.addEventListener('input', () => { lawState.query = si.value; clearTimeout(timer); timer = setTimeout(() => { doLawSearch(); if (lawState.expandedId) { const dc=$('#content .detail-container'); if(dc){dc.classList.remove('active');dc.innerHTML='';} const lc=$('#content .list-container'); if(lc)lc.style.display=''; lawState.expandedId=null; } }, 250); sc.classList.toggle('visible', lawState.query.length > 0); });
  sc.addEventListener('click', () => { si.value=''; lawState.query=''; sc.classList.remove('visible'); doLawSearch(); si.focus(); });
}

// ===== CASE MODULE =====
window._casesLoaded = false;
function initCaseModule() { if (!window._casesLoaded) { window._casesLoaded = true; loadCaseModule(); } }

const caseState = { cases: [], filtered: [], activeCat: 'all', activeTag: 'all', activeSrc: 'all', activeSev: 'all', query: '', fuse: null, expandedId: null, fullTexts: {} };

async function loadCaseModule() {
  const content = $('#content-cases');
  try {
    const [r1, r2] = await Promise.all([fetch('data/cases.json'), fetch('data/cases_full.json')]);
    caseState.cases = await r1.json(); caseState.fullTexts = await r2.json(); caseState.filtered = [...caseState.cases];
    caseState.fuse = new Fuse(caseState.cases, {
      keys: [{name:'party',weight:0.4},{name:'case_no',weight:0.2},{name:'penalty',weight:0.15},{name:'tags',weight:0.15},{name:'content_preview',weight:0.1}],
      threshold: 0.35, distance: 100, minMatchCharLength: 1, includeScore: true, includeMatches: true, ignoreLocation: true, ignoreFieldNorm: true
    });
    renderCaseSidebar(); renderCaseList(caseState.cases); bindCaseEvents();
    $('#total-count-cases').textContent = caseState.cases.length;
  } catch(e) { content.innerHTML = `<div class="empty-state"><div class="icon">❌</div><h3>数据加载失败</h3><div>${esc(e.message)}</div></div>`; }
}

// Config
const L1_CATS = ['公司治理与登记备案','募集销售与投资者适当性','产品运作与合同一致性','程序化交易与算法管理','异常交易与市场操纵','网下打新'];
const L2_LABELS = {
  '公司治理与登记备案': ['登记备案','内控合规','人员场所','虚假材料','信息报送','不配合监管','违规减持'],
  '募集销售与投资者适当性': ['合格投资者','销售违规','承诺收益','公开宣传','非法集资'],
  '产品运作与合同一致性': ['勤勉义务','信息披露','关联交易','挪用侵占','投资运作违规','估值违规','期货与资管业务','风险指标违规','资金池混同','募新还旧'],
  '程序化交易与算法管理': ['程序化交易管理'],
  '异常交易与市场操纵': ['异常交易行为','市场操纵内幕交易'],
  '网下打新': ['网下打新违规'],
};

function renderCaseSidebar() {
  const srcs = {'all': caseState.cases.length};
  const sevs = {'all': caseState.cases.length};
  const l1counts = {'all': caseState.cases.length};
  const l2counts = {};
  for (const c of caseState.cases) {
    const src = c.source || '其他'; srcs[src] = (srcs[src]||0) + 1;
    sevs[c.severity] = (sevs[c.severity]||0) + 1;
    const seen = new Set();
    for (const tag of (c.tags||[])) {
      const [l1,l2] = tag.split('/');
      if (l1 && l2) {
        l2counts[tag] = (l2counts[tag]||0) + 1;
        if (!seen.has(l1)) { l1counts[l1] = (l1counts[l1]||0) + 1; seen.add(l1); }
      }
    }
  }

  let h = '<div class="sidebar-section"><div class="sidebar-title">处罚来源</div>';
  h += `<div class="filter-item${caseState.activeSrc==='all'?' active':''}" data-src="all"><span class="filter-name">全部</span><span class="filter-count">${srcs.all}</span></div>`;
  for (const [s,n] of Object.entries(srcs)) { if (s==='all') continue;
    const short = s.includes('中基协')?'中基协':s.includes('证监会')?'证监会派出机构':s.length>6?s.slice(0,10)+'…':s;
    h += `<div class="filter-item${caseState.activeSrc===s?' active':''}" data-src="${s}"><span class="filter-name">${short}</span><span class="filter-count">${n}</span></div>`; }
  h += '</div>';

  h += '<div class="sidebar-section"><div class="sidebar-title">违规类型</div>';
  h += `<div class="filter-item${caseState.activeCat==='all'?' active':''}" data-cat="all"><span class="filter-name">全部</span><span class="filter-count">${l1counts.all}</span></div>`;
  for (const l1 of L1_CATS) {
    const n = l1counts[l1]||0; if (!n) continue;
    const active = caseState.activeCat === l1;
    h += `<div class="filter-item${active?' active':''}" data-cat="${l1}"><span class="filter-name">${l1}</span><span class="filter-count">${n}</span></div>`;
    // Show sub-categories for active or "all"
    if (active || caseState.activeCat === 'all') {
      for (const l2 of (L2_LABELS[l1]||[])) {
        const tag = `${l1}/${l2}`; const n2 = l2counts[tag]||0; if (!n2) continue;
        h += `<div class="filter-item${caseState.activeTag===tag?' active':''}" data-tag="${tag}" style="padding-left:32px;font-size:12px"><span class="filter-name">└ ${l2}</span><span class="filter-count">${n2}</span></div>`;
      }
    }
  }
  h += '</div>';

  h += '<div class="sidebar-section"><div class="sidebar-title">处分级别</div>';
  for (const [sev, n] of [['all',caseState.cases.length],['严重',sevs['严重']||0],['较重',sevs['较重']||0],['一般',sevs['一般']||0],['较轻',sevs['较轻']||0]]) {
    h += `<div class="filter-item${caseState.activeSev===sev?' active':''}" data-sev="${sev}"><span class="filter-name">${sev==='all'?'全部':sev}</span><span class="filter-count">${n}</span></div>`; }
  h += '</div>';

  $('#sidebar-cases').innerHTML = h;
  $$('.filter-item', $('#sidebar-cases')).forEach(el => el.addEventListener('click', () => {
    if (el.dataset.src !== undefined) caseState.activeSrc = el.dataset.src;
    if (el.dataset.cat !== undefined) { caseState.activeCat = el.dataset.cat; caseState.activeTag = 'all'; }
    if (el.dataset.tag !== undefined) caseState.activeTag = el.dataset.tag;
    if (el.dataset.sev !== undefined) caseState.activeSev = el.dataset.sev;
    caseState.expandedId = null; const dc = $('#content-cases .detail-container'); if (dc) { dc.classList.remove('active'); dc.innerHTML=''; }
    const lc = $('#content-cases .list-container'); if (lc) lc.style.display = '';
    doCaseSearch(); renderCaseSidebar();
  }));
}

function doCaseSearch() {
  let results;
  if (caseState.query.trim()) { const fr = caseState.fuse.search(caseState.query.trim()); results = fr.map(r => r.item); }
  else results = [...caseState.cases];
  if (caseState.activeSrc !== 'all') results = results.filter(c => (c.source||'') === caseState.activeSrc);
  if (caseState.activeTag !== 'all') results = results.filter(c => (c.tags||[]).includes(caseState.activeTag));
  else if (caseState.activeCat !== 'all') results = results.filter(c => (c.tags||[]).some(t => t.startsWith(caseState.activeCat+'/')));
  if (caseState.activeSev !== 'all') results = results.filter(c => c.severity === caseState.activeSev);
  caseState.filtered = results; renderCaseList(results); $('#total-count-cases').textContent = results.length;
}

function renderCaseList(cases) {
  const content = $('#content-cases'); content.innerHTML = '';
  const srcs = {}, sevs = {};
  for (const c of cases) { sevs[c.severity] = (sevs[c.severity]||0)+1; srcs[c.source||'其他'] = (srcs[c.source||'其他']||0)+1; }
  let statsH = '<div class="stats-bar">';
  statsH += `<div class="stat-item">📊 共 ${cases.length} 条</div>`;
  for (const [s,n] of Object.entries(srcs)) { if (n) statsH += `<div class="stat-item">${s.length>8?s.slice(0,8)+'…':s}: ${n}条</div>`; }
  for (const [s,n] of [['严重',sevs['严重']],['较重',sevs['较重']],['一般',sevs['一般']],['较轻',sevs['较轻']]]) if (n) statsH += `<div class="stat-item"><span class="badge sev-${s}">${s}</span> ${n}条</div>`;
  statsH += '</div>'; content.innerHTML = statsH;
  if (!cases.length) { content.innerHTML += '<div class="empty-state"><div class="icon">🔍</div><h3>未找到匹配的案例</h3><div>请调整筛选条件</div></div>'; return; }
  const list = document.createElement('div'); list.className = 'list-container'; content.appendChild(list);
  const detail = document.createElement('div'); detail.className = 'detail-container'; content.appendChild(detail);
  for (const c of cases) {
    const card = document.createElement('div'); card.className = 'card'; card.dataset.id = c.id;
    const srcLabel = (c.source||'').includes('中基协')?'中基协':(c.source||'').includes('证监会')?'证监会':(c.source||'其他');
    card.innerHTML = `<div class="card-header"><div class="card-title">${esc(c.party||c.name)}</div><span class="badge sev-${c.severity}">${esc(c.severity)}</span></div><div class="card-meta"><span style="color:var(--c-accent)">[${esc(srcLabel)}]</span><span>${esc(c.date)}</span><span>|</span><span>${esc(c.case_no||'—')}</span><span>|</span><span>${esc(c.agency||'')}</span></div><div class="card-tags">${(c.tags||[]).slice(0,5).map(tag => { const short = tag.split('/').pop(); return `<span class="badge" style="background:var(--c-accent-light);color:var(--c-accent);font-size:11px">${esc(short)}</span>`; }).join(' ')}</div><div class="card-preview">${esc(trunc(c.penalty, 100))}</div>`;
    card.addEventListener('click', () => showCaseDetail(c)); list.appendChild(card);
  }
}

function showCaseDetail(c) {
  const list = $('#content-cases .list-container'), detail = $('#content-cases .detail-container');
  list.style.display = 'none'; detail.classList.add('active'); detail.innerHTML = ''; caseState.expandedId = c.id;
  const fullText = caseState.fullTexts[c.id] || '';
  let html = `<button class="detail-back">← 返回列表</button>
    <div class="detail-title">${esc(c.party||c.name)}</div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:20px;font-size:14px">
      <tr><td style="padding:6px 12px 6px 0;color:var(--c-text2);white-space:nowrap;width:80px">处罚机构</td><td style="padding:6px 0">${esc(c.agency||'—')}</td></tr>
      <tr><td style="padding:6px 12px 6px 0;color:var(--c-text2)">被处罚对象</td><td style="padding:6px 0"><strong>${esc(c.party||c.name)}</strong> <span class="badge" style="background:var(--c-accent-light);color:var(--c-accent)">${esc(c.party_type||'')}</span></td></tr>
      <tr><td style="padding:6px 12px 6px 0;color:var(--c-text2)">来源</td><td style="padding:6px 0"><span class="badge" style="background:var(--c-accent-light);color:var(--c-accent)">${esc(c.source||'')}</span></td></tr>
      <tr><td style="padding:6px 12px 6px 0;color:var(--c-text2)">时间</td><td style="padding:6px 0">${esc(c.date)}${c.case_no ? ' &nbsp;|&nbsp; 文号：'+esc(c.case_no) : ''}</td></tr>
      <tr><td style="padding:6px 12px 6px 0;color:var(--c-text2)">监管措施</td><td style="padding:6px 0"><span class="badge sev-${c.severity}">${esc(c.severity)}</span> <strong style="color:var(--c-red)">${esc(c.penalty)}</strong></td></tr>
    </table>`;

  // Violations
  if (c.violations.length) {
    html += '<div class="detail-section"><h3>📋 违规事项</h3>';
    const realV = c.violations.filter(v => v.length > 15);
    for (let i = 0; i < realV.length; i++) {
      html += `<div style="margin:6px 0;padding:8px 12px;background:var(--c-bg);border-radius:4px;font-size:13px;line-height:1.6"><strong style="color:var(--c-accent)">${i+1}.</strong> ${esc(realV[i])}</div>`;
    }
    html += '</div>';
  }

  // Tags (两级分类)
  if ((c.tags||[]).length) {
    html += '<div class="detail-section"><h3>🏷️ 违规分类</h3><div style="display:flex;flex-wrap:wrap;gap:4px">';
    // Group by L1
    const byL1 = {};
    for (const tag of (c.tags||[])) {
      const [l1, l2] = tag.split('/');
      if (!byL1[l1]) byL1[l1] = [];
      byL1[l1].push(l2);
    }
    for (const [l1, l2s] of Object.entries(byL1)) {
      html += `<div style="margin:4px 0"><span class="badge" style="background:var(--c-accent);color:#fff;font-size:12px;margin-right:4px">${esc(l1)}</span>${l2s.map(l2 => `<span class="badge" style="background:var(--c-accent-light);color:var(--c-accent);font-size:11px">${esc(l2)}</span>`).join(' ')}</div>`;
    }
    html += '</div></div>';
  }

  // Laws violated
  if (c.laws.length) {
    html += '<div class="detail-section"><h3>📖 违反规定</h3><div style="display:flex;flex-wrap:wrap;gap:6px">';
    for (const l of c.laws.slice(0,20)) {
      html += `<span class="badge" style="background:#f0f4ff;color:var(--c-accent);font-size:12px;border:1px solid #d0daf0">${esc(l)}</span>`;
    }
    html += '</div></div>';
  }

  // OCR full text
  html += `<div class="detail-section"><h3>📄 OCR 全文</h3><div class="detail-text">${htm(fullText, caseState.query)}</div></div>`;
  html += `<div style="margin-top:12px;font-size:12px;color:var(--c-text3)">📎 <a href="${esc(c.source_url)}" target="_blank" rel="noopener">查看PDF原文</a></div>`;

  detail.innerHTML = html;
  detail.querySelector('.detail-back').addEventListener('click', () => { detail.classList.remove('active'); detail.innerHTML=''; list.style.display=''; caseState.expandedId=null; });
  $('#content-cases').scrollTop = 0;
}

function bindCaseEvents() {
  const si = $('#search-input-cases'), sc = $('#search-clear-cases'); let timer;
  si.addEventListener('input', () => { caseState.query = si.value; clearTimeout(timer); timer = setTimeout(() => { doCaseSearch(); if (caseState.expandedId) { const dc=$('#content-cases .detail-container'); if(dc){dc.classList.remove('active');dc.innerHTML='';} const lc=$('#content-cases .list-container'); if(lc)lc.style.display=''; caseState.expandedId=null; } }, 250); sc.classList.toggle('visible', caseState.query.length > 0); });
  sc.addEventListener('click', () => { si.value=''; caseState.query=''; sc.classList.remove('visible'); doCaseSearch(); si.focus(); });
}

// Init
initLawModule();
window.addEventListener('resize', () => { const mobile = window.innerWidth <= 768; $$('.menu-btn').forEach(b => b.style.display = mobile ? 'block' : 'none'); $$('#header-cases .menu-btn').forEach(b => b.style.display = mobile ? 'block' : 'none'); });
</script>
</body>
</html>
